[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[project]
name = "neurodash"
version = "0.0.8"
description = "Web dashboard neurobehavioral data explorer."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "EricThomson", email = "thomson.eric@gmail.com" }
]
dependencies = [
  # Core UI
  "dash",
  "plotly",
  # Neural I/O
  "neo",
  "quantities",
  # Signal processing
  "lspopt",
  "numpy",
  "scipy",
  # Behavioral I/O
  "pandas",
  "openpyxl",
  # Video I/O (pyqtdash)
  "imageio[ffmpeg,pyav]",
  # pyqtdash viewer
  "pyqt6",
  "pyqtgraph",
  # single-instance launcher (map port -> PID for `neurodash --restart`)
  "psutil",
  # analysis utilities (currently used for smoothing) 
  "anaties",
]

[project.urls]
Repository = "https://github.com/EricThomson/neurodash"

[project.scripts]
neurodash = "neurodash.app:main"

[tool.uv.build-backend]
module-root = "src"